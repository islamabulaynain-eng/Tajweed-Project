<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المصحف المعلم التفاعلي لأحكام التجويد</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: '#ffffff',
            gold: { 50: '#FCF9F0', 100: '#F9F1DC', 300: '#E7C873', 500: '#D4AF37', 600: '#B59124', 700: '#8C6C11' },
            ink: { main: '#2C241B', muted: '#6B5E4F' }
          },
          fontFamily: {
            quran: ['"Amiri Quran"', 'serif'],
            cairo: ['"Cairo"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #FDFBF7;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23d4af37' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    .mushaf-frame {
      border: 8px solid #F9F1DC;
      outline: 2px solid #D4AF37;
      outline-offset: -6px;
      background-color: #ffffff;
      box-shadow: inset 0 0 20px rgba(212, 175, 55, 0.1), 0 10px 30px rgba(0,0,0,0.05);
    }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #E7C873; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #D4AF37; }
    
    .word-token {
      display: inline-block;
      cursor: pointer;
      transition: all 0.2s ease;
      padding: 0 2px;
      border-radius: 4px;
    }
    .word-token:hover { background-color: rgba(212, 175, 55, 0.1); }
  </style>
</head>
<body class="font-cairo text-ink-main pb-10">

  <!-- زر القائمة الجانبية للموبايل -->
  <button id="mobileMenuBtn" class="lg:hidden fixed top-4 right-4 z-[60] w-12 h-12 bg-surface border border-gold-300 text-gold-700 rounded-full shadow-lg flex items-center justify-center hover:bg-gold-50 transition-colors">
    <i class="ph-bold ph-list text-2xl"></i>
  </button>

  <!-- خلفية مظللة عند فتح قائمة الموبايل -->
  <div id="mobileOverlay" class="fixed inset-0 bg-ink-main/50 z-40 hidden lg:hidden backdrop-blur-sm transition-opacity"></div>

  <div class="max-w-[1400px] mx-auto px-4 pt-6">
    <header class="text-center mb-4 mt-4 lg:mt-0">
      <h1 class="font-quran text-3xl md:text-4xl text-gold-700 mb-2">المُصۡحَفُ المُعَلِّمُ</h1>
      <div class="flex flex-wrap gap-2 justify-center mt-4" id="filtersContainer"></div>
      
      <!-- بطاقة شرح الحكم التجويدي المختار -->
      <div id="ruleBriefCard" class="hidden max-w-2xl mx-auto mt-4 bg-surface p-3 rounded-xl border shadow-sm transition-all duration-300 text-right">
        <h3 id="ruleBriefTitle" class="font-bold mb-1 text-sm md:text-base"></h3>
        <p id="ruleBriefDesc" class="text-ink-muted text-xs md:text-sm leading-relaxed"></p>
      </div>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start relative">
      
      <!-- 1. القائمة الجانبية اليمنى (فهرس السور) -->
      <aside id="surahIndexSidebar" class="fixed lg:static inset-y-0 right-0 z-50 w-64 lg:w-auto transform translate-x-full lg:translate-x-0 transition-transform duration-300 lg:col-span-2 bg-surface lg:rounded-xl shadow-2xl lg:shadow-md border-l lg:border border-gold-200 overflow-hidden flex flex-col h-full lg:h-[70vh]">
        <div class="bg-gold-50 p-4 lg:p-3 border-b border-gold-200 text-center font-bold text-gold-700 flex items-center justify-between lg:justify-center gap-2">
          <div class="flex items-center gap-2">
            <i class="ph-duotone ph-list-numbers text-xl"></i> فهرس السور
          </div>
          <button id="closeMobileMenuBtn" class="lg:hidden text-gold-600 hover:text-gold-700"><i class="ph-bold ph-x text-xl"></i></button>
        </div>
        <div id="surahList" class="flex-grow overflow-y-auto custom-scrollbar p-2 space-y-1">
          <div class="text-center text-sm text-ink-muted mt-10">جاري تحميل الفهرس...</div>
        </div>
      </aside>

      <!-- 2. إطار المصحف (الوسط) -->
      <div class="lg:col-span-7 mushaf-frame rounded-xl p-4 md:p-10 relative min-h-[70vh]">
        <div class="absolute top-2 right-2 text-gold-300/40"><i class="ph-fill ph-moon-stars text-2xl"></i></div>
        <div class="absolute top-2 left-2 text-gold-300/40"><i class="ph-fill ph-moon-stars text-2xl"></i></div>
        
        <!-- الترويسة داخل الإطار (اسم السورة والبسملة الثابتة) -->
        <div class="text-center border-b border-gold-200 pb-4 mb-6">
          <h2 id="currentSurahTitle" class="font-quran text-2xl md:text-3xl text-gold-600">...</h2>
          <!-- عنوان البسملة الذي يظهر لجميع السور عدا الفاتحة والتوبة -->
          <div id="basmalahHeader" class="hidden font-quran text-2xl md:text-[28px] text-ink-main mt-4">
            بِسۡمِ ٱللَّهِ ٱلرَّحۡمَٰنِ ٱلرَّحِيمِ
          </div>
        </div>
        
        <div id="quranContainer" class="max-w-[700px] mx-auto text-justify font-quran text-[26px] md:text-[32px] text-ink-main leading-[2.5] select-none" style="text-align-last: center;"></div>
      </div>

      <!-- 3. اللوحة الجانبية اليسرى (تفاصيل التجويد) -->
      <aside class="lg:col-span-3 sticky top-6 bg-surface rounded-xl shadow-md border border-gold-200 p-5 min-h-[70vh] flex flex-col">
        <div class="border-b border-gold-100 pb-3 mb-4 text-center">
          <h3 class="font-bold text-lg text-ink-main">الأحكام التجويدية</h3>
        </div>
        <div id="defaultDetailsState" class="flex-grow flex flex-col items-center justify-center text-center">
          <div class="w-14 h-14 bg-gold-50 rounded-full flex items-center justify-center mb-3 text-gold-400">
            <i class="ph-duotone ph-hand-pointing text-3xl"></i>
          </div>
          <p class="text-sm text-ink-muted leading-relaxed">اضغط على أي كلمة من السورة لعرض تفاصيل أحكامها التجويدية هنا.</p>
        </div>
        <div id="activeWordDetails" class="hidden flex-col h-full">
          <h2 id="selectedWord" class="font-quran text-4xl text-gold-700 text-center mb-4"></h2>
          <div id="rulesList" class="space-y-3 flex-grow overflow-y-auto custom-scrollbar pr-2"></div>
        </div>
      </aside>

    </main>
  </div>

  <!-- ربط ملف الجافاسكريبت الخارجي -->
  <script src="./js/app.js"></script>
</body>
</html>
