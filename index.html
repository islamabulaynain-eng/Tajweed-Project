    /* إطار المصحف */
    .mushaf-frame {
      border: 8px solid #F9F1DC;
      outline: 2px solid #D4AF37;
      outline-offset: -6px;
      background-color: #ffffff;
      box-shadow: inset 0 0 20px rgba(212, 175, 55, 0.1), 0 10px 30px rgba(0,0,0,0.05);
    }
    
    /* تنسيق شريط التمرير المخصص للقوائم الجانبية */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f1f1; 
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #E7C873; 
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #D4AF37; 
    }

    .word-token {
      display: inline-block;
      cursor: pointer;
      transition: all 0.2s ease;
      padding: 0 2px;
      border-radius: 4px;
    }
    .word-token:hover {
      background-color: rgba(212, 175, 55, 0.1);
    }
